<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>Bot Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--y:#e6ff3d;--l:#a9a8f8;--o:#ff6a2b;--g:#5dffb0;--r:#ff5d6c;--bg:#070708;--c1:#101013;--ln:#ffffff1f;--tx:#f4f4f6;--mu:#8d8d99;
--st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
--sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
small,.mu{color:var(--mu)}small{display:block;font-size:12.5px;font-weight:400}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100dvh}
#top{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 12px 8px}
.logo{flex:none;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--y),var(--l));color:#000;display:grid;place-items:center}
.botbtn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:var(--c1);border:1px solid var(--ln);border-radius:99px;padding:5px 14px 5px 5px;text-align:left}
.av{position:relative;flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--l),var(--y));color:#000;display:grid;place-items:center;font-weight:700;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ell{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--g);box-shadow:0 0 9px var(--g)}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:block}
.scroll{overflow-y:auto;padding:6px 14px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:12px}
#bar{display:flex;gap:2px;padding:6px 10px calc(var(--sb) + 6px);border-top:1px solid var(--ln);background:#0a0a0cee}
.tb{flex:1;display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--mu);padding:6px 0;font-size:12px}
.tb.on{color:var(--y)}
.cd{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:16px}
.cd h3{margin:0 0 10px;font-size:16px;font-weight:600}
.btn{border:0;border-radius:16px;background:var(--y);color:#000;padding:14px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:none;color:var(--tx);border:1px solid var(--ln);font-weight:600}
.btn.dng{background:var(--r);color:#fff}.btn.sec.dng{background:none;color:var(--r);border-color:var(--r)}
.btn.full{width:100%}.btn:disabled{opacity:.4}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.note{color:var(--mu);font-size:14px;line-height:1.55;white-space:pre-line;margin:0}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:28px 18px}.empty .i{width:44px;height:44px;color:var(--y)}.empty h3{margin:0}
.seg{display:flex;gap:4px;background:#0a0a0c;border:1px solid var(--ln);border-radius:99px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:8px 10px;color:var(--mu)}.seg button.on{background:var(--y);color:#000;font-weight:700}
label{display:block;color:var(--mu);margin:14px 0 6px;font-size:13px}
input[type=text],select,textarea{width:100%;background:#0a0a0c;border:1px solid var(--ln);border-radius:14px;padding:12px;outline:0;font-size:16px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--y)}textarea{min-height:110px;resize:vertical}
.sw{position:relative;display:inline-block;width:48px;height:28px;flex:none;margin:0}.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:#2a2a32;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--y)}.sw input:checked+i::after{transform:translateX(20px);background:#000}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff10}.line:last-child{border-bottom:0}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:14px}.kpi b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars i{flex:1;min-height:2px;border-radius:4px 4px 0 0;background:var(--l)}.bars i:last-child{background:var(--y)}
.hbr{display:grid;gap:4px;margin-bottom:10px}.hbr div:first-child{display:flex;justify-content:space-between;gap:8px}.hbl{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.hbl i{display:block;height:100%;background:linear-gradient(90deg,var(--l),var(--y));border-radius:99px}
/* bot + profile */
.hero{display:flex;gap:14px;align-items:center}.hero .av{width:56px;height:56px;font-size:24px}
.run{width:100%;margin-top:16px;border:0;border-radius:20px;padding:22px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.run.go{background:var(--y);color:#000;box-shadow:0 10px 30px #e6ff3d33}.run.stop{background:#ff5d6c22;color:var(--r);border:1px solid var(--r)}.run:disabled{opacity:.7}
.alert{margin-top:12px;padding:12px 14px;border-radius:14px;background:#ff6a2b22;border:1px solid var(--o);color:#ffd2bd;font-size:14px;line-height:1.5;display:grid;gap:10px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:18px;font-size:17px;font-weight:600}
.tile .ti{width:44px;height:44px;border-radius:14px;background:#a9a8f822;color:var(--l);display:grid;place-items:center;flex:none}
.tile>span:nth-child(2){flex:1;min-width:0}.tile>i{color:var(--mu);font-style:normal;font-size:22px}
.brow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ffffff10}.brow:last-child{border-bottom:0}.brow>.ell{cursor:pointer}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;background:var(--y);color:#000;font-weight:700}
/* canvas */
#cv{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#ffffff26 1px,transparent 1.5px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.w{fill:none;stroke:var(--l);stroke-width:2}.w.tmp{stroke:var(--y);stroke-dasharray:6 5}.w.bad{stroke:var(--o);stroke-dasharray:4 4}
.node{position:absolute;width:230px;border-radius:16px;background:#101012;border:1px solid var(--l);user-select:none;-webkit-user-select:none}
.node.start{border-color:var(--y)}.node.sel{box-shadow:0 0 0 2px var(--y),0 12px 40px #000a}
.hd{height:34px;display:flex;align-items:center;padding:0 12px;border-radius:15px 15px 0 0;background:var(--l);color:#000;font-weight:600;cursor:grab;position:relative}
.start .hd{background:var(--y)}.hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in{position:absolute;left:-8px;top:10px;width:14px;height:14px;border-radius:50%;background:#000;border:2px solid var(--l)}.start .in{display:none}
.tx{height:46px;overflow:hidden;padding:8px 12px;color:#bdbdc6;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rows{min-height:32px;padding-bottom:10px}.row{height:32px;padding:3px 10px;position:relative;cursor:pointer}
.row span{display:flex;align-items:center;justify-content:space-between;height:26px;border:1px solid #fff6;border-radius:13px;padding:0 12px;font-size:12.5px;overflow:hidden;white-space:nowrap}
.row.url span{border-color:var(--y);color:var(--y)}.row.bad span{border-color:var(--o);color:var(--o)}
.out{position:absolute;right:-8px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--l);border:2px solid #000;cursor:crosshair;touch-action:none}.row.url .out{display:none}.out::before{content:"";position:absolute;inset:-14px}
.nempty{color:#666;font-size:12px;padding:7px 14px}
.pnl{position:absolute;z-index:4;display:flex;align-items:center;gap:2px;background:#0c0c0fe8;border:1px solid var(--ln);border-radius:99px;padding:4px;backdrop-filter:blur(10px)}
.pnl button{flex:none;height:38px;min-width:38px;border:0;background:none;border-radius:99px;display:grid;place-items:center}.pnl button:disabled{opacity:.3}
#pl{left:10px;top:10px}#pr{right:10px;bottom:12px;padding:5px;gap:6px}
#pr button{padding:0 16px;display:flex;align-items:center;gap:6px;font-weight:700}#add{background:var(--y)!important;color:#000}
#apply{background:#17171c!important;border:1px solid var(--y)!important;color:var(--y)}#apply b{background:var(--y);color:#000;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 5px}
#menu{position:absolute;right:10px;bottom:70px;z-index:5;background:#131318;border:1px solid var(--ln);border-radius:20px;padding:6px;min-width:220px}
#menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px;border-radius:14px;text-align:left}#menu button:active{background:#ffffff12}#menu hr{border:0;border-top:1px solid var(--ln);margin:4px 8px}
#eflow{position:absolute;inset:0;display:grid;place-items:center;padding:20px;z-index:3}#eflow .cd{max-width:380px}
/* sheets */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
.sheet{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;background:var(--bg);opacity:0;transform:translateY(14px);transition:opacity .2s,transform .22s}.sheet.shown{opacity:1;transform:none}
.sh{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(var(--sb) + 24px);width:100%;max-width:640px;margin:0 auto}
.shh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;margin:0 -16px 12px;padding:calc(var(--st) + 10px) 16px 10px;background:#070708f2;backdrop-filter:blur(12px)}.shh h3{margin:0;font-size:20px;flex:1}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--c1);display:grid;place-items:center}
.sheet.modal{align-items:center;justify-content:center;padding:20px;background:#000b}
.modal .sh{flex:none;height:auto;max-height:86%;max-width:400px;background:#131318;border:1px solid var(--ln);border-radius:24px;padding:20px}.modal .sh h3{margin:0 0 8px;font-size:20px}.modal p{margin:0 0 16px;color:#c9c9d2;line-height:1.5}
.bl{display:grid;gap:8px}.br{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--ln);border-radius:14px;padding:8px 10px}.br.bad{border-color:var(--o)}.br input{border:0;background:none;padding:6px}.br .bm{flex:1;min-width:0}.br small{padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br button{flex:none;width:36px;height:36px;border-radius:12px;border:1px solid var(--ln);background:none;display:grid;place-items:center}
.tpl{display:grid;gap:10px}.tpl b{font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:var(--y);color:#000;border-radius:99px;padding:11px 18px;z-index:99;max-width:90vw;text-align:center;font-weight:600}.toast.err{background:var(--o)}
/* preview */
.pv{background:#0e1621;border-radius:20px;padding:12px;display:grid;gap:8px;min-height:320px;align-content:start}
.bub{max-width:92%;background:#182533;border-radius:16px 16px 16px 4px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;justify-self:start}.bub.me{justify-self:end;background:#2b5278;border-radius:16px 16px 4px 16px}
.bub code{background:#0003;border-radius:5px;padding:1px 5px}.bub .lk{color:#6ab3f3;text-decoration:underline}
.kb{display:grid;gap:4px}.kbr{display:grid;gap:4px}.kbb{border:0;background:#2b5278cc;border-radius:10px;padding:10px 8px;font-size:13.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.noanim *{transition:none!important}
</style></head><body>
<div id="app">
<header id="top">
 <i class="logo" data-ic="bot"></i>
 <button class="botbtn" id="botbtn"><span class="av" id="bav">+</span><span class="ell" id="bname">Добавить бота</span><i class="dot" id="bdot"></i></button>
</header>
<div id="views">
 <section class="view on" id="v-flow">
  <div id="cv"><div id="world"><svg id="svg"></svg><div id="nodes"></div></div></div>
  <div id="eflow" hidden></div>
  <div class="pnl" id="pl"><button id="undo" aria-label="Отменить" data-ic="undo"></button><button id="redo" aria-label="Повторить" data-ic="redo"></button><button data-z="-1" aria-label="Отдалить" data-ic="minus"></button><button data-z="1" aria-label="Приблизить" data-ic="plus"></button><button id="fit" aria-label="Показать всё" data-ic="fit"></button></div>
  <div class="pnl" id="pr"><button id="add"><i data-ic="plus"></i>Добавить</button><button id="apply" hidden>Применить <b>0</b></button></div>
  <div id="menu" hidden>
   <button data-m="screen"><i data-ic="screen"></i>Новый экран</button>
   <button data-m="btn"><i data-ic="btn"></i>Кнопка на экран</button>
   <button data-m="url"><i data-ic="link"></i>Ссылка на экран</button><hr>
   <button data-m="tpl"><i data-ic="box"></i>Шаблоны</button>
   <button data-m="pv"><i data-ic="play"></i>Предпросмотр</button>
   <button data-m="lay"><i data-ic="lay"></i>Расставить автоматически</button>
  </div>
 </section>
 <section class="view scroll" id="v-stats"></section>
 <section class="view scroll" id="v-bot"></section>
 <section class="view scroll" id="v-me"></section>
</div>
<nav id="bar">
 <button class="tb on" data-tab="flow"><i data-ic="flow"></i>Схема</button>
 <button class="tb" data-tab="stats"><i data-ic="chart"></i>Статистика</button>
 <button class="tb" data-tab="bot"><i data-ic="bot"></i>Бот</button>
 <button class="tb" data-tab="me"><i data-ic="user"></i>Профиль</button>
</nav>
<div id="layer"></div>
</div>
<script>
"use strict";
const CLOUD={apiKey:"AIzaSyANZINM6R29i3erpEdzs60oHZsDPBXVIOI",projectId:"manageyourbot"};
const API=`https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents`;
const BOT_URL="https://t.me/ManageYourOwnBot";
const tg=window.Telegram?.WebApp,KB=new URLSearchParams(location.search).get("k")=="1";
const IC={undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',fit:'<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',lay:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',link:'<path d="M8 16 16 8M9 8h7v7"/>',screen:'<rect x="4" y="5" width="16" height="14" rx="3"/>',btn:'<rect x="4" y="8" width="16" height="8" rx="4"/>',play:'<path d="M8 5l11 7-11 7z"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',check:'<path d="m5 12.5 4.5 4.5L19 7"/>',back:'<path d="m15 5-7 7 7 7"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',flow:'<rect x="3" y="4" width="7" height="6" rx="2"/><rect x="14" y="14" width="7" height="6" rx="2"/><path d="M10 7h2a3 3 0 0 1 3 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',gift:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 9v11M3 9h18M12 9c-3 0-5-4-2-4 2 0 2 4 2 4zm0 0c3 0 5-4 2-4-2 0-2 4-2 4z"/>',plug:'<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),nf=n=>Number(n||0).toLocaleString("ru-RU"),sum=(a,k)=>a.reduce((s,r)=>s+(r[k]||0),0);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},lsDel=k=>{try{localStorage.removeItem(k)}catch{}};

const applyPrefs=()=>document.body.classList.toggle("noanim",!PREF.anim);
function toast(t,err){const e=document.createElement("div");e.className="toast"+(err?" err":"");e.textContent=t;document.body.append(e);hap(err?"err":"ok");setTimeout(()=>e.remove(),2800)}
const openTg=u=>{try{tg?.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank")}catch{window.open(u,"_blank")}};
const copyText=(t,msg)=>navigator.clipboard?.writeText(t).then(()=>toast(msg||"Скопировано"),()=>toast("Не удалось скопировать",1));

/* ---------- Состояние ---------- */
const W=230,HDR=34,TXT=46,ROW=32,MAXB=12,MAXN=40;
const S={tab:"flow",range:14,view:{x:30,y:30,k:1},hist:[],fut:[],set:{},post:"",del:false,sel:null,fitted:false,sess:{bots:[]},bot:null,flow:null,base:[],baseSig:"",token:new URLSearchParams(location.search).get("s"),offline:false,busy:null,runErr:null,ut:null};
const node=id=>S.flow.nodes.find(n=>n.id==id);

 <div class="cd"><h3>Настройки бота</h3><div class="line"><div>Обратная связь<small>Кнопка «Связаться» на старте</small></div><label class="sw"><input type="checkbox" id="sw-support" ${sup?"checked":""}><i></i></label></div>
  <label>Ответ на непонятные сообщения</label><input id="fb" type="text" maxlength="300" autocomplete="off" value="${esc(fb)}"></div>
 <div class="cd"><h3>Рассылка <small class="mu" style="display:inline">· ${nf(b.subs)} получателей</small></h3><textarea id="post" maxlength="4000" placeholder="Текст рассылки">${esc(S.post)}</textarea>
  <p class="note" style="margin-top:8px">Рассылка уйдёт после «Применить» и подтверждения в чате. Фото и видео — командой /post в вашем боте.</p>${S.post?'<button class="btn sec full" data-act="clrpost" style="margin-top:10px">Очистить текст</button>':""}</div>
 ${S.del?"":'<button class="btn sec dng full" data-act="delbot">Удалить бота</button>'}</div>`}

function tgUser(){let u=tg?.initDataUnsafe?.user;if(!u?.id&&tg?.initData){try{u=JSON.parse(new URLSearchParams(tg.initData).get("user")||"null")}catch{}}
 if(u?.id){lsSet("bb3:user",u);return u}return lsGet("bb3:user")||{first_name:"Пользователь",id:S.sess.uid}}
const planName=()=>({free:"Бесплатный",pro:"Pro",biz:"Business"}[S.sess.plan||"free"]||String(S.sess.plan).toUpperCase());
function renderMe(){
 const el=$("#v-me"),u=tgUser(),name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"Пользователь",bs=S.sess.bots||[],lim=S.sess.limit||5;
 const tile=(a,i,t,s)=>`<button class="tile" data-act="${a}"><span class="ti">${ic(i)}</span><span>${t}<small>${s}</small></span><i>›</i></button>`;
 el.innerHTML=`<div class="wrap"><div class="cd"><div class="hero"><span class="av">${esc(name[0].toUpperCase())}${u.photo_url?`<img src="${esc(u.photo_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span><div style="min-width:0;flex:1"><b class="ell" style="display:block;font-size:19px">${esc(name)}</b><span class="badge">${esc(planName())}</span></div></div></div>
 ${tile("plans","star","Тариф",esc(planName()))}${tile("bots","bot","Мои боты",bs.length+" из "+lim)}${tile("ref","gift","Пригласить друзей","Бонус за каждого друга")}${tile("settings","cog","Настройки","Вибро, анимации, сетка")}</div>`}

/* ---------- Панели профиля ---------- */
function openPlans(){
 const PLANS=[{k:"slot",n:"+1 слот бота",s:50,d:"Ещё один бот в вашем аккаунте"},{k:"pro",n:"Pro",s:250,d:"До 15 ботов, 40 экранов, приоритетная поддержка · 30 дней"},{k:"biz",n:"Business",s:700,d:"До 50 ботов, рассылки без лимита, без отметки конструктора · 30 дней"}];
 const d=sheet(`${head("Тариф")}<p class="note" style="margin-bottom:12px">Сейчас у вас: <b style="color:var(--y)">${esc(planName())}</b>. Оплата звёздами Telegram.</p><div class="bl">${PLANS.map(p=>`<div class="cd"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:17px">${esc(p.n)}</b><span class="badge">${p.s} ⭐</span></div><p class="note" style="margin:6px 0 12px">${esc(p.d)}</p><button class="btn full" data-pay="${p.k}">Оплатить ${p.s} ⭐</button></div>`).join("")}</div>`);
 d.addEventListener("click",e=>{const b=e.target.closest("[data-pay]");if(b)pay(PLANS.find(x=>x.k==b.dataset.pay),b)})}
async function pay(p,btn){
 if(S.offline||!S.token)return toast("Нет связи с конструктором. Попробуйте позже",1);
 if(!tg?.openInvoice)return toast("Оплата доступна только внутри Telegram",1);
 btn.disabled=true;btn.textContent="Готовим счёт…";const t0=Date.now();
 try{const f={bot:{stringValue:String(S.bot?.id||"")},plan:{stringValue:p.k},ts:{integerValue:String(t0)},v:{integerValue:"1"}};
  const r=await fetch(`${API}/orders/${encodeURIComponent(S.token)}?key=${CLOUD.apiKey}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});if(!r.ok)throw 0;
  let link=null;for(let i=0;i<10&&!link;i++){await new Promise(r=>setTimeout(r,1200));const q=await fetch(`${API}/invoices/${encodeURIComponent(S.token)}?key=${CLOUD.apiKey}`,{cache:"no-store"});
   if(q.ok){const j=await q.json();if(j.fields?.link&&+(j.fields.ts?.integerValue||0)>=t0)link=j.fields.link.stringValue}}
  if(!link)throw 0;
  tg.openInvoice(link,s=>{if(s=="paid"){toast("Оплачено! Тариф скоро активируется");hap("ok");setTimeout(()=>refresh(true),2500)}else if(s=="failed")toast("Оплата не прошла",1)})}
 catch{toast("Не удалось создать счёт. Попробуйте позже",1)}
 btn.disabled=false;btn.textContent="Оплатить "+p.s+" ⭐"}
function openBots(){
 const bs=S.sess.bots||[],lim=S.sess.limit||5;
 const d=sheet(`${head("Мои боты")}${bs.length?`<div class="cd" style="padding:6px 14px">${bs.map(b=>{const bz=!!(S.busy&&S.busy.id==b.id),on=bz?S.busy.target:!!b.running;return`<div class="brow"><span class="av" data-pick="${b.id}">${esc((b.username||"?")[0].toUpperCase())}</span><span class="ell" data-pick="${b.id}">@${esc(b.username)}<small>${b.id==S.bot?.id?"Открыт сейчас · ":""}${bz?(S.busy.target?"запускаем…":"останавливаем…"):on?"работает":"остановлен"}</small></span><label class="sw"><input type="checkbox" data-act="tgbot" data-id="${b.id}" ${on?"checked":""} ${S.busy?"disabled":""}><i></i></label></div>`}).join("")}</div>`:emptyCard()}
 <p class="note" style="margin:12px 0">${bs.length?`Ботов: ${bs.length} из ${lim}. Нажмите на бота, чтобы открыть его схему.`:""}</p>${bs.length?'<button class="btn full" data-act="master">Добавить бота</button>':""}`);
 d.addEventListener("click",e=>{const r=e.target.closest("[data-pick]");if(r){if(r.dataset.pick!=S.bot?.id){if(pendingList().length)toast("Неприменённые правки сохранены на этом устройстве");openBot(r.dataset.pick)}closeSheet(d)}else if(e.target.closest('[data-act="master"]'))closeSheet(d)});
 d._close=null}
const refLink=()=>BOT_URL+"?start=ref_"+(tgUser().id||"0");
function openRef(){
 const n=+S.sess.ref?.count||0,bn=+S.sess.ref?.bonus||0;
 sheet(`${head("Пригласить друзей")}<p class="note" style="margin-bottom:12px">Отправьте ссылку другу. Когда он создаст бота, вам начислится бонус.</p><div class="cd"><small>Ваша ссылка</small><div style="word-break:break-all;margin:6px 0 14px">${esc(refLink())}</div><div class="row2"><button class="btn" data-act="refshare">Поделиться</button><button class="btn sec" data-act="refcopy">Копировать</button></div></div>${n?`<p class="note" style="margin-top:12px">Вы пригласили друзей: <b>${nf(n)}</b>${bn?` · бонус: <b>${nf(bn)}</b>`:""}</p>`:""}`)}
function openSettings(){
 const d=sheet(`${head("Настройки")}<div class="cd">${[["haptic","Вибро-отклик","Короткие сигналы при нажатиях"],["snap","Привязка к сетке","Экраны выравниваются при перемещении"],["anim","Анимации","Плавные переходы"]].map(x=>`<div class="line"><div>${x[1]}<small>${x[2]}</small></div><label class="sw"><input type="checkbox" data-pref="${x[0]}" ${PREF[x[0]]?"checked":""}><i></i></label></div>`).join("")}</div>
 <button class="btn sec full" data-act="cleardrafts" style="margin-top:12px">Очистить неприменённые правки</button>`)}

/* ---------- События ---------- */
function showMenu(){$("#menu").hidden=false}function hideMenu(){$("#menu").hidden=true}
$("#add").onclick=e=>{e.stopPropagation();hap();$("#menu").hidden?showMenu():hideMenu()};
$("#apply").onclick=()=>{hideMenu();hap();openApply()};
$("#menu").onclick=e=>{const b=e.target.closest("[data-m]");if(!b||!S.flow)return;hideMenu();const k=b.dataset.m;
 if(k=="screen")addScreen();
 else if(k=="btn"||k=="url"){if(!S.sel||!node(S.sel))S.sel=S.flow.start;markSel();const id=addBtn(S.sel,k=="url"?"url":"go");if(id)openBtn(S.sel,id)}
 else if(k=="tpl")openTemplates();else if(k=="pv")openPreview(S.flow.start);else if(k=="lay"){mutate(()=>layout(S.flow.nodes,S.flow.start));fit();hap()}};
document.addEventListener("click",e=>{if(!e.target.closest("#menu,#add"))hideMenu();
 const a=e.target.closest("[data-act]");if(!a)return;const v=a.dataset.v;
 switch(a.dataset.act){
  case"toggle":toggleBot();break;case"tgbot":toggleBot(a.dataset.id);break;
  case"master":openMaster();break;case"retry":refresh(true);break;
  case"range":S.range=+v;renderStats();break;
  case"plans":openPlans();break;case"bots":openBots();break;case"ref":openRef();break;case"settings":openSettings();break;
  case"refshare":openTg("https://t.me/share/url?url="+encodeURIComponent(refLink())+"&text="+encodeURIComponent("Делаю Telegram-ботов без кода — попробуй!"));break;
  case"refcopy":copyText(refLink(),"Ссылка скопирована");break;
  case"copylink":copyText("https://t.me/"+S.bot.username,"Ссылка скопирована");break;
  case"clrpost":S.post="";saveSoon();renderBot();ui();break;
  case"undel":S.del=false;saveSoon();renderBot();ui();break;
  case"delbot":confirmBox("Удалить бота?","Схема, фото и статистика @"+esc(S.bot.username)+" будут удалены без возможности восстановления. Бот попросит подтвердить удаление в чате.","Удалить",()=>{S.del=true;saveSoon();renderBot();ui()},true);break;
  case"cleardrafts":confirmBox("Очистить правки?","Неприменённые изменения на этом устройстве будут удалены.","Очистить",()=>{Object.keys(localStorage).filter(k=>k.startsWith("bb3:")&&!["bb3:prefs","bb3:last","bb3:master","bb3:user"].includes(k)).forEach(k=>lsDel(k));if(S.bot)openBot(S.bot.id);toast("Правки очищены")},true);break}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id=="fb")setVal("fallback",t.value.slice(0,300)||S.bot.fallback);else if(t.id=="post"){S.post=t.value;saveSoon();ui()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="sw-support"){setVal("support",t.checked);renderBot()}else if(t.dataset?.pref){PREF[t.dataset.pref]=t.checked;lsSet("bb3:prefs",PREF);applyPrefs()}});
$$(".tb").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;hideMenu();hap();renderTab()});
$("#botbtn").onclick=()=>{hap();S.bot?openBots():openMaster()};
$("#undo").onclick=undo;$("#redo").onclick=redo;$("#fit").onclick=fit;
$$("[data-z]").forEach(b=>b.onclick=()=>zoomTo(S.view.k*(b.dataset.z=="1"?1.2:1/1.2)));
addEventListener("keydown",e=>{if(e.key=="Escape"&&stack.length)return closeSheet(stack[stack.length-1]);
 if(stack.length||S.tab!="flow"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="z"){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="y"){e.preventDefault();redo()}});
addEventListener("resize",applyView);
setInterval(refresh,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes?.();tg.setHeaderColor?.("#070708");tg.setBackgroundColor?.("#070708");try{if(tg.isVersionAtLeast?.("8.0")&&!tg.isFullscreen)tg.requestFullscreen()}catch{}}
$$("[data-ic]").forEach(e=>e.innerHTML=ic(e.dataset.ic));
applyPrefs();boot();
</script></body></html>
