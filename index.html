<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bot Builder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#111;--fg:#f3ece2;--mut:#8d8a85;--line:#ffffff17;--r:clamp(22px,6vw,30px);
--st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
--sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"SF Pro Display",Inter,system-ui,sans-serif;min-height:100dvh}
.mono,.tile span,h3,.pill,.go,.sub,label{font-family:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
#app{max-width:760px;margin:auto;padding:calc(var(--st) + 14px) clamp(12px,4vw,24px) calc(var(--sb) + 110px)}
h1{font-size:clamp(30px,9vw,46px);font-weight:400;text-align:center;margin:6px 0 20px}
h2{font-size:22px;font-weight:500;margin:0}h3{font-size:12px;color:var(--mut);font-weight:400;margin:26px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.tile{position:relative;aspect-ratio:1/1.12;border:0;border-radius:var(--r);overflow:hidden;background:#171717;color:var(--fg);cursor:pointer;padding:0;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile i{position:absolute;inset:0;background:var(--g);filter:saturate(1.05)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 18%,#0d0d0dcc 62%,#0d0d0d 92%);box-shadow:inset 0 0 0 1px #ffffff14;border-radius:inherit}
.tile span{position:absolute;z-index:2;left:8px;right:8px;bottom:16px;text-align:center;font-size:12px;color:#d9d3ca;word-break:break-word}
.tile b{position:absolute;z-index:2;left:0;right:0;top:34%;text-align:center;font:500 clamp(26px,8vw,38px) ui-monospace,Menlo,monospace;color:#2a2018;mix-blend-mode:normal}
.tile u{position:absolute;z-index:3;top:10px;right:12px;text-decoration:none;font-size:15px;opacity:.7;padding:6px}
.c0{--g:linear-gradient(#ffe9c9,#f4d5a8)}.c1{--g:linear-gradient(#ff9a82,#e8705f)}.c2{--g:linear-gradient(#9296ea,#7479cf)}.c3{--g:linear-gradient(#f4a09a,#c8587a)}.c4{--g:linear-gradient(#ffc27a,#ff6f91)}
.off{--g:linear-gradient(#7d7d7d,#4a4a4a)}.off b{color:#fff}
.wide{grid-column:1/-1;aspect-ratio:auto;height:92px}
.pills{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid #ffffff2e;background:#ffffff08;color:var(--fg);border-radius:18px;padding:13px 20px;font-size:12px;cursor:pointer}
.pill:nth-child(1){border-color:#f3a38a}.pill:nth-child(2){border-color:#b78cf0}.pill:nth-child(3){border-color:#6bd0c0}.pill:nth-child(4){border-color:#ffc27a}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#ffffff0a;color:var(--fg);font-size:22px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--line);border-radius:18px;margin-bottom:8px;background:#ffffff06}
.row p{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}
input,select,textarea{width:100%;background:#ffffff0a;border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:13px 14px;font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:#f3a38a}textarea{min-height:42dvh;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px clamp(12px,4vw,24px) calc(var(--sb) + 14px);background:linear-gradient(#1100,#111 38%);display:flex;gap:10px;max-width:760px;margin:auto}
.go,.sub{height:54px;border-radius:20px;border:0;font-size:13px;cursor:pointer;color:#241a14}
.go{flex:1;background:linear-gradient(90deg,#ff9a82,#ffc27a 55%,#ff6f91)}.sub{padding:0 22px;background:#ffffff14;color:var(--fg)}
.sheet{position:fixed;inset:0;z-index:20;background:#000c;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 16px);max-width:760px;margin:auto}
.note{color:var(--mut);font-size:13px;text-align:center;margin:0 0 14px}
@media(min-width:900px){body{background:radial-gradient(900px 500px at 50% -10%,#2a1f1a,#111 70%)}}
</style></head><body><div id="app"></div>
<script>
/* Публичный веб-конфиг Firebase: это не секрет. Доступ ограничивают правила Firestore (только чтение sessions/{токен}). */
const firebaseConfig = {
  apiKey: "AIzaSyANZINM6R29i3erpEdzs60oHZsDPBXVIOI",
  authDomain: "manageyourbot.firebaseapp.com",
  projectId: "manageyourbot",
  storageBucket: "manageyourbot.firebasestorage.app",
  messagingSenderId: "919379398898",
  appId: "1:919379398898:web:55798b0893c24f2309c06b",
  measurementId: "G-ZRQF3WRGVY"
};
const tg=window.Telegram?.WebApp,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEC=[["about","ℹ️","О нас"],["catalog","🛍","Каталог"],["faq","❓","FAQ"],["contacts","☎️","Контакты"],["links","🔗","Ссылки"],["schedule","🕘","Режим"],["location","📍","Адрес"],["rules","📋","Правила"],["delivery","🚚","Доставка"],["payment","💳","Оплата"],["promotions","🔥","Акции"],["reviews","⭐","Отзывы"],["portfolio","🖼","Портфолио"],["team","👥","Команда"],["booking","📅","Запись"],["news","📰","Новости"]];
const TPL={cafe:{n:"Кафе",on:["about","catalog","delivery","payment","schedule","location","contacts"],t:{welcome:"Добро пожаловать! Свежий кофе и десерты каждый день ☕",catalog:"Кофе — от 180 ₽\nДесерты — от 220 ₽",schedule:"Ежедневно 08:00–22:00"}},
salon:{n:"Салон",on:["about","catalog","booking","portfolio","reviews","schedule","contacts"],t:{welcome:"Красота без очередей ✨ Запишитесь онлайн",booking:"Выберите услугу и напишите нам — подберём время.",catalog:"Стрижка — от 1500 ₽\nМаникюр — от 1800 ₽"}},
shop:{n:"Магазин",on:["about","catalog","delivery","payment","promotions","reviews","contacts"],t:{welcome:"Добро пожаловать в магазин! Смотрите каталог и акции 🛍",delivery:"Курьером по городу — 1–2 дня.\nПочтой — 3–7 дней.",promotions:"Скидка 10% на первый заказ."}},
course:{n:"Курс",on:["about","catalog","faq","team","reviews","news","contacts"],t:{welcome:"Учитесь в удобном темпе 🎓 Программа, спикеры и отзывы — в меню.",faq:"Как проходит обучение? — Онлайн, в записи и вживую."}}};
const DEMO={limit:5,bots:[{id:"demo",username:"demo_bot",name:"Demo",subs:128,enabled:{about:1,contacts:1,faq:1},sections:{},buttons:[]}]};
let sess,demo=false,cur,cfg,view="home";
const b64=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
async function enc(o){const st=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "BB1."+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
async function load(){const s=new URLSearchParams(location.search).get("s");
 try{if(!s||CFG.projectId.startsWith("YOUR"))throw 0;
  const r=await fetch(`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents/sessions/${encodeURIComponent(s)}?key=${CFG.apiKey}`);
  if(!r.ok)throw 0;sess=JSON.parse((await r.json()).fields.json.stringValue)}catch{sess=DEMO;demo=true}render()}
const tile=(c,label,big,attr="",extra="")=>`<button class="tile ${c}" ${attr}><i></i>${big!=null?`<b>${esc(big)}</b>`:""}${extra}<span>${esc(label)}</span></button>`;
function home(){const b=sess.bots,subs=b.reduce((a,x)=>a+(x.subs||0),0);
 return `<h1>Overview</h1>${demo?'<p class=note>Демо-режим: откройте конструктор командой /builder в боте</p>':""}<div class=grid>
 ${tile("c0","боты",`${b.length}/${sess.limit}`)}${tile("c1","подписчики",subs)}
 ${b.map((x,i)=>tile("c"+((i+2)%5),"@"+x.username,null,`data-bot="${esc(x.id)}"`)).join("")}
 ${tile("off","+ добавить бота",null,'id=add')}</div>`}
function editor(){const sc=cfg.sections,cu=cur.sections||{};
 return `<div class=top><button class=ic id=back>‹</button><h2>@${esc(cur.username)}</h2></div>
 <h3>сценарии</h3><div class=pills>${Object.entries(TPL).map(([k,v])=>`<button class=pill data-tpl=${k}>${v.n}</button>`).join("")}</div>
 <h3>разделы · нажмите — вкл/выкл, ✎ — текст</h3><div class=grid>
 ${tile("c4 wide","приветствие",null,'data-e=welcome')}
 ${SEC.map(([k,ic,n],i)=>tile("c"+(i%5)+(cfg.enabled[k]?"":" off"),ic+" "+n,null,`data-t=${k}`,`<u data-e=${k}>✎</u>`)).join("")}</div>
 <h3>свои кнопки (${cfg.buttons.length}/12)</h3>
 ${cfg.buttons.map((b,i)=>`<div class=row><p>${esc(b.label)} <small>· ${esc(b.kind)}</small></p><button class=ic data-del=${i}>×</button></div>`).join("")}
 <div class=form><input id=bl placeholder="Название" maxlength=32><select id=bk><option value=url>Ссылка</option><option value=text>Текст</option></select>
 <input id=bv class=full placeholder="https://… или текст ответа"><button class="sub full" id=badd>+ кнопка</button></div>
 <div class=bar><button class=go id=send>отправить боту</button><button class=sub id=copy>код</button></div>`}
function render(){$("#app").innerHTML=view=="home"?home():editor();if(tg){view=="home"?tg.BackButton.hide():tg.BackButton.show()}}
function openBot(id){cur=sess.bots.find(x=>x.id==id);cfg={enabled:{},sections:{},buttons:(cur.buttons||[]).map(b=>({...b}))};SEC.forEach(([k])=>cfg.enabled[k]=!!(cur.enabled||{})[k]);view="edit";render()}
function sheet(key){const name=key=="welcome"?"приветствие":SEC.find(s=>s[0]==key)[2];
 const d=document.createElement("div");d.className="sheet";d.innerHTML=`<h3 style="margin:0">${name}</h3><textarea maxlength=3500></textarea><div class=bar style="position:static;padding:0"><button class=go>сохранить</button><button class=sub>отмена</button></div>`;
 const ta=d.querySelector("textarea");ta.value=cfg.sections[key]??(cur.sections||{})[key]??"";document.body.append(d);
 d.querySelector(".go").onclick=()=>{cfg.sections[key]=ta.value;d.remove()};d.querySelector(".sub").onclick=()=>d.remove()}
function code(c,msg){const d=document.createElement("div");d.className="sheet";d.innerHTML=`<p class=note>${msg}</p><textarea readonly></textarea><div class=bar style="position:static;padding:0"><button class=go>копировать</button><button class=sub>закрыть</button></div>`;
 d.querySelector("textarea").value=c;document.body.append(d);
 d.querySelector(".go").onclick=async e=>{try{await navigator.clipboard.writeText(c);e.target.textContent="скопировано ✓"}catch{d.querySelector("textarea").select()}};d.querySelector(".sub").onclick=()=>d.remove()}
const pack=()=>enc({v:1,bot:cur.id,enabled:cfg.enabled,sections:cfg.sections,buttons:cfg.buttons});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-e],[data-t],[data-bot],[data-tpl],[data-del],button");if(!t)return;const D=t.dataset;
 if(D.e){e.stopPropagation();return sheet(D.e)}
 if(D.bot)return openBot(D.bot);
 if(D.t){cfg.enabled[D.t]=!cfg.enabled[D.t];return render()}
 if(D.tpl){const p=TPL[D.tpl];SEC.forEach(([k])=>cfg.enabled[k]=p.on.includes(k));Object.assign(cfg.sections,p.t);return render()}
 if(D.del){cfg.buttons.splice(+D.del,1);return render()}
 if(t.id=="add"){tg?.close();return}
 if(t.id=="back"){view="home";return render()}
 if(t.id=="badd"){const l=$("#bl").value.trim(),k=$("#bk").value,v=$("#bv").value.trim();
  if(!l||!v||cfg.buttons.length>=12)return;if(k=="url"&&!/^https:\/\/\S+$/.test(v))return tg?.showAlert?.("Ссылка должна начинаться с https://");
  cfg.buttons.push({label:l,kind:k,value:v});return render()}
 if(t.id=="copy")return code(await pack(),"Отправьте этот код боту обычным сообщением.");
 if(t.id=="send"){const c=await pack();
  if(new Blob([c]).size>4000)return code(c,"Конфиг больше 4 КБ — скопируйте код и отправьте боту сообщением.");
  if(tg?.initData&&!demo){try{return tg.sendData(c)}catch{}}code(c,"Отправьте этот код боту обычным сообщением.")}});
if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes?.();tg.setHeaderColor?.("#111111");tg.setBackgroundColor?.("#111111");
 try{if(tg.isVersionAtLeast?.("8.0")&&!tg.isFullscreen)tg.requestFullscreen()}catch{}
 tg.BackButton.onClick(()=>{view="home";render()})}
load();
</script></body></html>
