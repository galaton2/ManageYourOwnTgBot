<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bot Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--y:#e6ff3d;--l:#a9a8f8;--o:#ff6a2b;--g:#5dffb0;--b:#6fd3ff;--r:#ff5d6c;--bg:#070708;--c1:#101013;--c2:#17171c;--ln:#ffffff1f;--tx:#f4f4f6;--mu:#8d8d99;
--st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
--sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(900px 520px at 90% -12%,#a9a8f826,transparent 60%),radial-gradient(700px 420px at -10% 108%,#e6ff3d16,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.m,.mu{font-family:"Space Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.mu{color:var(--mu)}
#app{display:flex;flex-direction:column;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) 12px 8px}
.logo{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--y),var(--l));color:#000;display:grid;place-items:center;font-weight:700;font-style:normal;box-shadow:0 4px 18px #e6ff3d33}
.botbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--c1);border:1px solid var(--ln);border-radius:99px;padding:5px 12px 5px 5px;text-align:left}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--l),var(--y));color:#000;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--g);box-shadow:0 0 9px var(--g)}
.car{color:var(--mu);font-size:11px}
.pillerr{flex:none;color:var(--o);border:1px solid var(--o);border-radius:99px;padding:6px 10px;white-space:nowrap;font-family:"Space Mono",monospace;font-size:10.5px}
.ic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--c1)}
.banner{margin:0 12px 6px;padding:9px 12px;border-radius:12px;background:#ff6a2b22;border:1px solid var(--o);color:#ffc8ae;font-size:12.5px}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:block;animation:vin .22s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;padding:4px 14px 130px;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto;display:grid;gap:12px}
#bar{display:flex;gap:2px;padding:6px 10px calc(var(--sb) + 6px);border-top:1px solid var(--ln);background:#0a0a0cee;backdrop-filter:blur(14px);z-index:6}
.tb{flex:1;display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--mu);padding:6px 0;border-radius:14px;position:relative}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--y)}.tb.on::after{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--y);box-shadow:0 0 12px var(--y)}
.tb span{font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
#fab{position:fixed;right:14px;bottom:calc(var(--sb) + 78px);z-index:7;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--y);color:#000;padding:13px 18px;font-weight:700;box-shadow:0 8px 30px #e6ff3d44,0 2px 0 #fff6 inset;animation:pop .3s ease}
#fab[hidden]{display:none}
#fab b{background:#000;color:var(--y);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
#fab.mini span{display:none}#fab.mini{padding:13px 14px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* cards */
.cd{background:linear-gradient(180deg,#14141a,#101013);border:1px solid var(--ln);border-radius:20px;padding:14px}
.cd h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd h3 small{font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:4px;background:#0a0a0c;border:1px solid var(--ln);border-radius:99px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:7px 10px;color:var(--mu);font-family:"Space Mono",monospace;font-size:11px;white-space:nowrap}
.seg button.on{background:var(--y);color:#000;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chp{border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--mu)}
.chp.on{border-color:var(--l);color:#000;background:var(--l);font-weight:600}
.main{border:0;border-radius:99px;background:var(--y);color:#000;padding:12px 18px;font-weight:700;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
.ghost{border:1px solid var(--ln);background:none;border-radius:99px;padding:11px 16px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.ghost.danger{border-color:var(--r);color:var(--r)}
.ghost:disabled,.ic:disabled,.seg button:disabled,.main:disabled{opacity:.35}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2>*{flex:1}
/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,#17171d,#0f0f12);border:1px solid var(--ln);border-radius:18px;padding:12px 12px 10px;min-height:118px}
.kv{font-size:27px;font-weight:700;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.kd{margin-top:4px;min-height:18px}
.dl{display:inline-block;border-radius:99px;padding:2px 8px;font-size:11px;font-family:"Space Mono",monospace;background:#ffffff12;color:var(--mu)}
.dl.up{background:#5dffb022;color:var(--g)}.dl.dn{background:#ff5d6c22;color:var(--r)}
.ksp{position:absolute;right:6px;bottom:6px;opacity:.9}
.ks{margin-top:4px}
/* charts */
.ch{position:relative;width:100%}
.ch svg{display:block;touch-action:pan-y;overflow:visible}
.gl{stroke:#ffffff14;stroke-width:1}.ax{fill:var(--mu);font:10px "Space Mono",monospace}
.cl{stroke:#ffffff55;stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;pointer-events:none;background:#000d;border:1px solid var(--ln);border-radius:12px;padding:7px 10px;font-size:11.5px;z-index:3;white-space:nowrap;backdrop-filter:blur(8px)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .05s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s var(--d,0ms) cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.noanim .draw{animation:none;stroke-dashoffset:0}.noanim .bar,.noanim #fab,.noanim .view.on{animation:none}
.legend2{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--mu);font-size:12px}.legend2 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.donut{width:120px;height:120px;flex:none}.donut .dv{font:700 19px "Space Grotesk";fill:#fff}.donut .ds{font:9px "Space Mono";fill:var(--mu);text-transform:uppercase}
.hb{display:grid;gap:9px}.hbr{display:grid;gap:4px}
.hbt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.hbt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbl{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.hbl i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--l),var(--y));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.plist{display:grid;gap:8px}.pit{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b0b0e;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.empty{color:#777;font-size:12.5px;padding:8px 4px}
.hero{text-align:center;padding:30px 16px;display:grid;gap:10px;justify-items:center}.hero .big{font-size:42px}
/* switches */
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:#2a2a32;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--y)}.sw input:checked+i::after{transform:translateX(18px);background:#000}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10}.line:last-child{border-bottom:0}
.line small{display:block;color:var(--mu);font-size:12px}
/* inputs */
label{display:flex;justify-content:space-between;color:var(--mu);margin:10px 0 5px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
input[type=text],input:not([type]),select,textarea{width:100%;background:#0a0a0c;border:1px solid var(--ln);border-radius:14px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--y)}textarea{min-height:110px;resize:vertical}
/* profile */
.prof{display:flex;gap:14px;align-items:center}.prof .av{width:64px;height:64px;font-size:26px;border:2px solid var(--y)}
.badge{display:inline-block;border-radius:99px;padding:3px 9px;font:10px "Space Mono",monospace;text-transform:uppercase;background:#ffffff14;margin:2px 4px 0 0}.badge.y{background:var(--y);color:#000}.badge.l{background:var(--l);color:#000}
.meter{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--l),var(--y));border-radius:99px}
.step{display:flex;gap:12px;padding:8px 0}.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;font-size:12px}
.bot-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10;cursor:pointer}.bot-row:last-child{border-bottom:0}
.bot-row .bn small{display:block;color:var(--mu);font-weight:400;font-size:12px}
/* canvas */
#cv{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#ffffff26 1px,transparent 1.5px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.w{fill:none;stroke:var(--l);stroke-width:2}.w.tmp{stroke:var(--y);stroke-dasharray:6 5}.w.bad{stroke:var(--o);stroke-dasharray:4 4}
.node{position:absolute;width:230px;border-radius:16px;background:#101012;border:1px solid var(--l);user-select:none;transition:box-shadow .2s}
.node.start{border-color:var(--y)}.node.sel{box-shadow:0 0 0 2px var(--y),0 12px 40px #000a}
.hd{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:15px 15px 0 0;background:var(--l);color:#000;font-weight:600;cursor:grab;position:relative}
.start .hd{background:var(--y)}.hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv{font:700 10px "Space Mono",monospace;font-style:normal;background:#000;color:var(--o);border-radius:99px;padding:2px 7px}
.ph{font-style:normal;font-size:13px;opacity:.4;cursor:pointer}.ph.has{opacity:1}
.in{position:absolute;left:-8px;top:10px;width:14px;height:14px;border-radius:50%;background:#000;border:2px solid var(--l)}.start .in{display:none}
.tx{height:46px;overflow:hidden;padding:8px 12px;color:#bdbdc6;font-size:12.5px;cursor:pointer;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rows{min-height:32px;padding-bottom:10px}
.row{height:32px;padding:3px 10px;position:relative;cursor:pointer}
.row span{display:flex;align-items:center;justify-content:space-between;height:26px;border:1px solid #fff6;border-radius:13px;padding:0 12px;font-size:12.5px;overflow:hidden;white-space:nowrap}
.row.url span{border-color:var(--y);color:var(--y)}.row.bad span{border-color:var(--o);color:var(--o)}
.out{position:absolute;right:-8px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--l);border:2px solid #000;cursor:crosshair;touch-action:none}.row.url .out{display:none}
.nempty{color:#666;font-size:12px;padding:7px 14px}
.tools,.zoom{position:absolute;top:10px;display:flex;gap:4px;background:#0c0c0fe6;border:1px solid var(--ln);border-radius:99px;padding:4px;backdrop-filter:blur(10px);z-index:4}
.tools{left:10px;max-width:calc(100% - 100px);overflow-x:auto;scrollbar-width:none}.zoom{right:10px}
.tools button,.zoom button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:none;font-size:16px}
.tools button.on{background:var(--o);color:#000}.tools button:disabled{opacity:.3}
.tools i{width:1px;background:var(--ln);margin:6px 2px;flex:none}
#dock{position:absolute;left:10px;bottom:calc(10px);display:flex;gap:8px;z-index:4;background:#0c0c0fe6;border:1px solid var(--ln);border-radius:20px;padding:8px;backdrop-filter:blur(10px)}
.chip{touch-action:none;user-select:none;cursor:grab;border:1px solid var(--ln);border-radius:12px;padding:7px 8px;width:62px;text-align:center;line-height:1.15;font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.chip b{display:block;font-size:18px;font-weight:400}
.chip[data-t=screen]{background:var(--l);color:#000;border-color:var(--l)}.chip[data-t=btn]{border-color:#fff}.chip[data-t=url]{border-color:var(--y);color:var(--y)}
.gc{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);opacity:.92}
/* sheets */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
.sheet{position:fixed;inset:0;pointer-events:auto;background:#000a;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.sheet.in{opacity:1}
.sh{width:100%;max-width:560px;background:#111114;border:1px solid var(--ln);border-radius:26px 26px 0 0;padding:8px 16px calc(var(--sb) + 18px);max-height:92dvh;overflow:auto;transform:translateY(30px);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
.sheet.in .sh{transform:none}.sh.full{height:92dvh}
.grab{display:block;width:40px;height:4px;border-radius:4px;background:#ffffff33;margin:4px auto 10px}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.shh h3{margin:0;font-size:17px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:none}
.fmt{display:flex;gap:6px;margin-bottom:6px}.fmt button{width:38px;height:32px;border-radius:10px;border:1px solid var(--ln);background:#0a0a0c;font-weight:700}
.bl{display:grid;gap:6px}.br{display:flex;align-items:center;gap:8px;background:#0a0a0c;border:1px solid var(--ln);border-radius:14px;padding:6px 8px}.br.bad{border-color:var(--o)}
.br .bt{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.br .bi{width:26px;height:26px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;flex:none}
.br button{width:30px;height:30px;border-radius:10px;border:1px solid var(--ln);background:none}.br button:disabled{opacity:.25}
.tpl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#0a0a0c;border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:8px}.tpl b{font-size:24px}.tpl small{display:block;color:var(--mu)}
.codebox{font:11px "Space Mono",monospace;min-height:80px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--y);color:#000;border-radius:99px;padding:10px 16px;z-index:99;max-width:90vw;text-align:center;font-weight:600;animation:pop .2s}.toast.err{background:var(--o)}
/* preview */
.pv{width:100%;max-width:420px;height:92dvh;display:flex;flex-direction:column;background:#0e1621;border:1px solid var(--ln);border-radius:26px 26px 0 0;overflow:hidden;transform:translateY(30px);transition:transform .22s}
.sheet.in .pv{transform:none}
.pvh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#17212b;border-bottom:1px solid #0006}
.pvb{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,#0e1621,#101c2a)}
.bub{align-self:flex-start;max-width:92%;background:#182533;border-radius:16px 16px 16px 4px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;animation:pop .2s;font-size:14px}
.bub a,.bub .lk{color:#6ab3f3;text-decoration:underline}.bub code{background:#0003;border-radius:5px;padding:1px 5px;font-family:"Space Mono",monospace;font-size:12.5px}
.bph{height:120px;border-radius:12px;margin:-2px 0 8px;background:linear-gradient(135deg,#2b5278,#6ab3f3);display:grid;place-items:center;font-size:30px}
.kb{align-self:stretch;display:grid;gap:4px}.kbr{display:grid;gap:4px}
.kbb{border:0;background:#2b5278cc;border-radius:10px;padding:10px 8px;font-size:13.5px;color:#fff;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbb:active{filter:brightness(1.3)}
@media(min-width:700px){.sheet{align-items:center}.sh,.pv{border-radius:26px}.sh.full,.pv{height:86dvh}}
@media(max-width:699px){#dock .chip{width:56px}}
</style></head><body>
<div id="app">
<header id="top">
 <i class="logo">◉</i>
 <button class="botbtn" id="botbtn"><span class="av" id="bav">?</span><span class="bn" id="bname">загрузка…</span><i class="dot" id="bdot"></i><b class="car">▾</b></button>
 <span class="pillerr" id="err" hidden></span>
 <button class="ic" id="fs" title="На весь экран">⛶</button>
</header>
<div id="exp" class="banner" hidden></div>
<div id="views">
 <section class="view on" id="v-flow">
  <div id="cv"><div id="world"><svg id="svg"></svg><div id="nodes"></div></div></div>
  <div class="tools"><button id="undo" title="Отменить">↶</button><button id="redo" title="Повторить">↷</button><i></i><button id="fit" title="Показать всё">⌖</button><button id="lay" title="Расставить автоматически">▤</button><button id="heat" title="Тепловая карта">🔥</button><i></i><button id="tpl" title="Шаблоны">✦</button><button id="pvb" title="Предпросмотр">▶</button></div>
  <div class="zoom"><button data-z="1">+</button><button data-z="-1">−</button></div>
  <div id="dock"><div class="chip" data-t="screen"><b>▭</b>экран</div><div class="chip" data-t="btn"><b>◉</b>кнопка</div><div class="chip" data-t="url"><b>↗</b>ссылка</div></div>
 </section>
 <section class="view scroll" id="v-stats"></section>
 <section class="view scroll" id="v-bot"></section>
 <section class="view scroll" id="v-me"></section>
</div>
<button id="fab" hidden><span>Отправить боту</span><b>0</b></button>
<nav id="bar">
 <button class="tb on" data-tab="flow"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="2"/><rect x="14" y="14" width="7" height="6" rx="2"/><path d="M10 7h2a3 3 0 0 1 3 3v4"/></svg><span>Схема</span></button>

/* ============ Данные: Firestore (чтение) / демо ============ */
async function fetchSess(token){
 const r=await fetch(`https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/sessions/${encodeURIComponent(token)}?key=${firebaseConfig.apiKey}`,{cache:"no-store"});
 if(!r.ok)throw new Error("http "+r.status);
 const d=await r.json(),j=JSON.parse(d.fields.json.stringValue);j.exp=j.exp||d.fields.exp?.timestampValue;return j}
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function demoStats(nodes,seed,scale){
 const r=mulberry(seed),days=[],today=new Date();today.setUTCHours(0,0,0,0);
 for(let i=59;i>=0;i--){const d=new Date(+today-i*864e5),wd=d.getUTCDay(),trend=1+(60-i)/60*1.2,wk=(wd==0||wd==6)?.78:1;
  const dau=Math.round((20+r()*14)*scale*trend*wk),nw=Math.round((3+r()*7)*scale*trend*wk*(r()<.1?3:1)),views=Math.round(dau*(2.2+r()*1.4)),n={};
  nodes.forEach((x,k)=>{const v=Math.round(views*(k==0?.34:.62/(k+1.2))*(.7+r()*.6));if(v>0)n[x.id]=v});
  const h=Array(24).fill(0);for(let k=0;k<views;k++)h[clamp(Math.round(14+(r()+r()+r()-1.5)*8),0,23)]++;
  days.push({d:d.toISOString().slice(0,10),new:nw,dau,views,support:r()<.3?Math.round(r()*3):0,unsub:r()<.4?Math.round(r()*2):0,n,h})}
 const total=Math.round(sum(days,"new")*1.4+300*scale),act=Math.round(total*.86),un=Math.round(total*.09);
 return{days,aud:{total,active:act,unsub:un,blocked:total-act-un},ret:{d1:{base:Math.round(total*.8),ok:Math.round(total*.34)},d7:{base:Math.round(total*.6),ok:Math.round(total*.13)}},posts:[{at:new Date(+today-3*864e5).toISOString(),sent:Math.round(act*.97),failed:Math.round(act*.03)},{at:new Date(+today-12*864e5).toISOString(),sent:Math.round(act*.9),failed:Math.round(act*.06)}]}}

 const mk=(k,name,seed,sc)=>{const t=TPL.find(x=>x.k==k),nodes=buildTpl(t),st=demoStats(nodes,seed,sc);

function layout(nodes,start){
 const by=Object.fromEntries(nodes.map(n=>[n.id,n])),depth={[start]:0},q=[start];
 while(q.length){const id=q.shift();(by[id]?.btns||[]).forEach(b=>{if(b.kind=="go"&&b.to&&by[b.to]&&!(b.to in depth)){depth[b.to]=depth[id]+1;q.push(b.to)}})}
 const md=Math.max(0,...Object.values(depth));nodes.forEach(n=>{if(!(n.id in depth))depth[n.id]=md+1});
 const ys={};nodes.slice().sort((a,b)=>depth[a.id]-depth[b.id]).forEach(n=>{const d=depth[n.id];ys[d]=ys[d]||40;n.x=60+d*300;n.y=ys[d];ys[d]+=nh(n)+28})}
const TPL=[
 {k:"card",ico:"👤",name:"Визитка",desc:"О нас, услуги, портфолио, контакты",w:"Привет! 👋 Здесь можно узнать обо мне и связаться.",items:[["ℹ️ О нас","**Коротко о нас.**\nРасскажите, чем вы занимаетесь и чем отличаетесь."],["🧰 Услуги","Перечислите услуги и цены:\n• Услуга 1 — от 1000 ₽\n• Услуга 2 — от 2500 ₽"],["🖼 Портфолио","Покажите примеры работ. Фото к экрану добавляется через бота."],["☎️ Контакты","Телефон: +7 …\nПочта: …\n[Сайт](https://example.com)"]]},
 {k:"shop",ico:"🛍",name:"Магазин",desc:"Каталог, доставка, оплата, акции, отзывы",w:"Добро пожаловать в наш магазин! 🛍\nВыберите раздел:",items:[["🛍 Каталог","Выберите категорию:",[["👕 Новинки","Свежие поступления. Добавьте товары и цены."],["🔥 Хиты","Самые популярные товары."]]],["🚚 Доставка","Способы, стоимость и сроки доставки."],["💳 Оплата","Карты, наличные, рассрочка — опишите способы оплаты."],["🎁 Акции","Действующие акции и промокоды: `SALE10`"],["⭐ Отзывы","Отзывы довольных клиентов."],["☎️ Контакты","Телефон, почта и [Instagram](https://instagram.com)."]]},
 {k:"service",ico:"📅",name:"Услуги и запись",desc:"Прайс, запись, часы работы, адрес, FAQ",w:"Здравствуйте! Запишитесь онлайн или узнайте подробности.",items:[["💈 Услуги и цены","Прайс-лист:\n• Услуга 1 — 1500 ₽\n• Услуга 2 — 3000 ₽"],["📅 Запись","Как записаться: напишите нам или выберите время по [ссылке](https://example.com)."],["🕘 Часы работы","Пн–Пт 10:00–20:00\nСб–Вс 11:00–18:00"],["📍 Адрес","г. Город, ул. Улица, 1. Как добраться — опишите."],["❓ FAQ","Ответы на частые вопросы."]]},
 {k:"community",ico:"👥",name:"Сообщество",desc:"О нас, правила, новости, ссылки, FAQ",w:"Привет! Это бот нашего сообщества 👋",items:[["ℹ️ О сообществе","Чем живёт сообщество и кому оно подойдёт."],["📋 Правила","1. Уважайте друг друга\n2. Без спама\n3. Без рекламы"],["📰 Новости","Последние новости и анонсы."],["🔗 Ссылки","Канал, чат и сайт."],["❓ FAQ","Частые вопросы новичков."]]},

function buildTpl(t){
 const nodes=[{id:"start",title:"Старт",text:t.w,x:0,y:0,cols:2,btns:[]}];
 const add=(parent,it)=>{const[title,text,kids=[]]=it,id=uid(nodes),me={id,title:title.slice(0,40),text,x:0,y:0,cols:1,btns:[]};nodes.push(me);parent.btns.push({id:uid(nodes),label:title.slice(0,32),kind:"go",to:id});kids.forEach(k=>add(me,k))};
 t.items.forEach(it=>add(nodes[0],it));layout(nodes,"start");return nodes}

/* ============ Холст ============ */
const cv=$("#cv"),world=$("#world"),svg=$("#svg"),nodesEl=$("#nodes"),P=new Map();let mode=null,st=null;
const out=(n,i)=>({x:n.x+W,y:n.y+HDR+TXT+i*ROW+ROW/2}),inp=n=>({x:n.x,y:n.y+17});
const DEFS='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a9a8f8"/></marker></defs>';
const curve=(a,b,c)=>`<path class="${c}" d="M${a.x} ${a.y}C${a.x+70} ${a.y} ${b.x-70} ${b.y} ${b.x} ${b.y}" marker-end="url(#ar)"/>`;
function wires(tmp){let h=DEFS;
 S.flow.nodes.forEach(n=>n.btns.forEach((b,i)=>{if(b.kind=="url")return;const a=out(n,i),t=b.to&&node(b.to);h+=t?curve(a,inp(t),"w"):`<path class="w bad" d="M${a.x} ${a.y}h28"/>`}));
 if(tmp&&tmp.p){const n=node(tmp.nid);h+=curve(out(n,n.btns.findIndex(b=>b.id==tmp.bid)),tmp.p,"w tmp")}
 svg.innerHTML=h}
function renderFlow(){
 if(!S.flow){nodesEl.innerHTML="";svg.innerHTML="";return}
 const mx=Math.max(1,...Object.values(S.heatMap));
 nodesEl.innerHTML=S.flow.nodes.map(n=>{const start=n.id==S.flow.start,v=S.heat?(S.heatMap[n.id]||0):null,r=v!=null?v/mx:0;
  const hs=v!=null?`;border-color:var(--o);box-shadow:0 0 ${Math.round(r*34)}px rgba(255,106,43,${(.12+.6*r).toFixed(2)})`:"";
  return`<div class="node ${start?"start":""} ${S.sel==n.id?"sel":""}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px${hs}"><div class="hd"><b class="in"></b><span>${start?"▶ ":""}${esc(n.title)}</span>${v!=null?`<em class="hv">${nf(v)}</em>`:""}<i class="ph ${hasPhoto(n)?"has":""}">📷</i></div><div class="tx">${esc(n.text)}</div><div class="rows">${n.btns.map(b=>`<div class="row ${b.kind=="url"?"url":""} ${bad(b)?"bad":""}" data-b="${b.id}"><span>${esc(b.label)}<small>${b.kind=="url"?"↗":""}</small></span><u class="out"></u></div>`).join("")||'<div class="nempty">+ бросьте сюда кнопку</div>'}</div></div>`}).join("");
 wires();$("#heat").classList.toggle("on",S.heat);$("#undo").disabled=!S.hist.length;$("#redo").disabled=!S.fut.length}
function markSel(){$$(".node").forEach(x=>x.classList.toggle("sel",x.dataset.id==S.sel))}
function applyView(){world.style.transform=`translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`;cv.style.backgroundSize=`${24*S.view.k}px ${24*S.view.k}px`;cv.style.backgroundPosition=`${S.view.x}px ${S.view.y}px`}
const w2=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-S.view.x)/S.view.k,y:(e.clientY-r.top-S.view.y)/S.view.k}};
function zoomTo(nk,cx,cy){nk=clamp(nk,.3,1.6);const r=cv.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;S.view.x=cx-(cx-S.view.x)*nk/S.view.k;S.view.y=cy-(cy-S.view.y)*nk/S.view.k;S.view.k=nk;applyView()}
function fit(){const r=cv.getBoundingClientRect(),ns=S.flow?.nodes||[];if(!ns.length||!r.width)return applyView();S.fitted=true;
 const x0=Math.min(...ns.map(n=>n.x)),y0=Math.min(...ns.map(n=>n.y)),x1=Math.max(...ns.map(n=>n.x+W)),y1=Math.max(...ns.map(n=>n.y+nh(n)));
 S.view.k=Math.max(.3,Math.min(1,(r.width-40)/(x1-x0),(r.height-150)/(y1-y0)));S.view.x=(r.width-(x1-x0)*S.view.k)/2-x0*S.view.k;S.view.y=70-y0*S.view.k;applyView()}
const dist=()=>{const[a,b]=[...P.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
const snapG=v=>PREF.snap?Math.round(v/10)*10:Math.round(v);
function tap(t){const nd=t.closest(".node");if(!nd)return;const n=node(nd.dataset.id);S.sel=n.id;markSel();hap();

 if(P.size==2){mode="pinch";st={d:dist(),k:S.view.k};return}
 const t=e.target,nd=t.closest(".node");st={sx:e.clientX,sy:e.clientY,moved:false,t};
 if(t.closest(".out")){mode="wire";st.nid=nd.dataset.id;st.bid=t.closest(".row").dataset.b;st.pre=snapF()}
 else if(nd&&t.closest(".hd")&&!t.closest(".ph")){mode="drag";st.n=node(nd.dataset.id);st.ox=st.n.x;st.oy=st.n.y;st.pre=snapF();S.sel=st.n.id;markSel()}
 else if(nd)mode="tap";else{mode="pan";st.vx=S.view.x;st.vy=S.view.y}});
cv.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(mode=="pinch"&&P.size==2){const[a,b]=[...P.values()],r=cv.getBoundingClientRect();zoomTo(st.k*dist()/st.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
 if(!st||!mode)return;const dx=e.clientX-st.sx,dy=e.clientY-st.sy;if(Math.hypot(dx,dy)>6)st.moved=true;if(!st.moved)return;

const C={y:"#e6ff3d",l:"#a9a8f8",o:"#ff6a2b",g:"#5dffb0",b:"#6fd3ff",r:"#ff5d6c"};
function mono(p){const n=p.length;if(n<2)return n?`M${p[0][0]} ${p[0][1]}`:"";
 const dx=[],m=[];for(let i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0]||1;m[i]=(p[i+1][1]-p[i][1])/dx[i]}
 const t=[m[0]];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;t[n-1]=m[n-2];

function renderMe(){
 const el=$("#v-me"),u=tg?.initDataUnsafe?.user||{first_name:S.demo?"Demo":"Пользователь",id:S.sess.uid},name=[u.first_name,u.last_name].filter(Boolean).join(" "),bs=S.sess.bots||[];
 const left=S.sess.exp?new Date(S.sess.exp)-Date.now():null,totalSubs=bs.reduce((a,b)=>a+b.subs,0),totalViews=bs.reduce((a,b)=>a+sum(b.stats.days.slice(-30),"views"),0);
 const nodesTot=bs.reduce((a,b)=>a+b.flow.nodes.length,0),lim=S.sess.limit||5;
 el.innerHTML=`<div class="wrap">
 <div class="cd"><div class="prof"><span class="av">${u.photo_url?`<img src="${esc(u.photo_url)}" alt="">`:esc((u.first_name||"?")[0].toUpperCase())}</span><div style="flex:1;min-width:0"><b style="font-size:19px">${esc(name)}</b><div class="mu" style="text-transform:none">${u.username?"@"+esc(u.username)+" · ":""}ID ${esc(u.id)}</div><div>${S.sess.admin?'<span class="badge y">админ</span>':'<span class="badge l">владелец</span>'}${u.is_premium?'<span class="badge">⭐ premium</span>':""}${u.language_code?`<span class="badge">${esc(u.language_code)}</span>`:""}</div></div></div>
  ${S.sess.since?`<div class="mu" style="margin-top:10px">С нами с ${new Date(S.sess.since).toLocaleDateString("ru-RU")}</div>`:""}</div>
 <div class="kpis"><div class="kpi"><div class="mu">Боты</div><div class="kv">${bs.length}<span class="mu"> / ${lim}</span></div><div class="meter"><i style="width:${Math.min(100,bs.length/lim*100)}%"></i></div></div>
 <div class="kpi"><div class="mu">Подписчики</div><div class="kv">${nf(totalSubs)}</div><div class="mu ks" style="text-transform:none">во всех ботах</div></div>
 <div class="kpi"><div class="mu">Просмотры 30 дн</div><div class="kv">${nf(totalViews)}</div><div class="mu ks" style="text-transform:none">${nf(nodesTot)} экранов всего</div></div></div>
 <div class="cd"><h3>Мои боты</h3>${bs.map(b=>{const d=b.stats.days.slice(-14),a=avg(d.slice(-7),"dau"),p=avg(d.slice(0,7),"dau");return`<div class="bot-row" data-act="pickbot" data-id="${b.id}"><span class="av">${esc((b.username||"?")[0].toUpperCase())}</span><span class="bn">@${esc(b.username)}<small>${nf(b.subs)} подп. · ${b.flow.nodes.length}/${MAXN} экранов</small></span>${spark(d.map(r=>r.dau),C.l,70,26)}${chip(delta(a,p))}</div>`}).join("")||'<div class="empty">Ботов пока нет</div>'}</div>
 ${S.sess.platform?`<div class="cd"><h3>🛡 Платформа</h3><div class="row2" style="gap:8px">${[["Пользователи",S.sess.platform.users],["Боты",S.sess.platform.bots],["Запущено",S.sess.platform.running],["Подписки",S.sess.platform.subs]].map(x=>`<div class="pit"><span class="mu">${x[0]}</span><b>${nf(x[1])}</b></div>`).join("")}</div></div>`:""}
 <div class="cd"><h3>Сессия</h3><div class="line"><div>Статус<small>${S.demo?"демо-режим":S.expired?"недоступна":"активна · данные читаются из Firestore"}</small></div><span class="badge ${S.expired?"":"y"}">${S.demo?"demo":S.expired?"off":"live"}</span></div>
  <div class="line"><div>Осталось<small>после — отправьте боту /builder</small></div><b id="cd">${left==null?"—":fmtLeft(left)}</b></div></div>
 <div class="cd"><h3>Настройки интерфейса <small class="mu">только на этом устройстве</small></h3>
  ${[["haptic","Вибро-отклик","короткие тактильные сигналы"],["snap","Привязка к сетке","экраны выравниваются по 10 px"],["anim","Анимации","графики, переходы, счётчики"]].map(x=>`<div class="line"><div>${x[1]}<small>${x[2]}</small></div><label class="sw" style="margin:0"><input type="checkbox" data-pref="${x[0]}" ${PREF[x[0]]?"checked":""}><i></i></label></div>`).join("")}
  <button class="ghost" data-act="cleardrafts" style="margin-top:10px;width:100%">Очистить локальные черновики</button></div>
 <div class="cd"><h3>Как это работает</h3>
  <div class="step"><b>1</b><div>Вы собираете схему и настройки здесь — мини-апп <b>только читает</b> данные и ничего не пишет на сервер.</div></div>
  <div class="step"><b>2</b><div>Кнопка «Отправить боту» передаёт изменения боту в чате; бот проверяет и применяет их.</div></div>
  <div class="step"><b>3</b><div>Фото экранов загружаются только через бота (значок 📷 на экране).</div></div></div>
 <div class="mu" style="text-align:center;padding:6px">Bot Builder ${VERSION} · Firestore read-only</div></div>`}
const fmtLeft=ms=>{if(ms<=0)return"истекла";const s=Math.floor(ms/1000),m=Math.floor(s/60);return m>=60?Math.floor(m/60)+" ч "+m%60+" мин":m+":"+String(s%60).padStart(2,"0")}

/* ============ Шапка, вкладки, UI ============ */
function renderTop(){const b=S.bot;$("#bav").textContent=b?(b.username||"?")[0].toUpperCase():"+";$("#bname").textContent=b?"@"+b.username:(S.expired?"сессия недоступна":"нет ботов");$("#bdot").className="dot "+(b?.running?"on":"")}
function renderTab(){
 $$(".view").forEach(v=>v.classList.toggle("on",v.id=="v-"+S.tab));$$(".tb").forEach(t=>t.classList.toggle("on",t.dataset.tab==S.tab));
 if(S.tab=="flow"){renderFlow();if(!S.fitted)requestAnimationFrame(fit)}else if(S.tab=="stats")renderStats();else if(S.tab=="bot")renderBot();else renderMe()}
function go(tab){S.tab=tab;hap();renderTab();ui()}
function ui(){
 const p=pendingList(),f=$("#fab");f.hidden=!p.length;f.classList.toggle("mini",S.tab=="flow");$("b",f).textContent=p.length;
 const e=errCount();$("#err").hidden=!e;$("#err").textContent="ошибок: "+e;
 try{p.length?tg?.enableClosingConfirmation?.():tg?.disableClosingConfirmation?.()}catch{}
 const left=S.sess.exp?new Date(S.sess.exp)-Date.now():null,ex=$("#exp");
 if(S.expired||(left!=null&&left<=0)){ex.hidden=false;ex.textContent="Сессия истекла. Отправьте боту /builder и откройте конструктор заново. Изменения всё ещё можно отправить."}
 else if(left!=null&&left<5*60000){ex.hidden=false;ex.textContent="Сессия закончится через "+fmtLeft(left)+". Отправьте изменения или откройте /builder снова."}else ex.hidden=true}

document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const v=a.dataset.v;
 switch(a.dataset.act){
  case"range":S.range=+v;renderStats();break;
  case"metric":S.metric=v;renderStats();break;
  case"cmp":S.cmp=!S.cmp;renderStats();break;
  case"pickbot":openBot(a.dataset.id);break;
  case"openbot":openTg("https://t.me/"+S.bot.username);break;
  case"copylink":navigator.clipboard?.writeText("https://t.me/"+S.bot.username).then(()=>toast("Ссылка скопирована"),()=>toast("Не удалось скопировать",1));break;
  case"clrpost":S.post="";saveDraftSoon();renderBot();ui();break;
  case"undel":S.del=false;saveDraftSoon();renderBot();ui();break;
  case"delbot":{const d=sheet(`${head("Удалить бота?")}<p>Будут удалены схема, фото и статистика @${esc(S.bot.username)}. Это действие нельзя отменить. Бот попросит подтверждение в чате.</p><div class="acts2"><button class="ghost" data-x>Нет</button><button class="main" style="background:var(--r);color:#fff" id="yes">Удалить</button></div>`);$("#yes",d).onclick=()=>{S.del=true;saveDraftSoon();closeSheet(d);renderBot();ui()};break}
  case"cleardrafts":Object.keys(localStorage).filter(k=>k.startsWith("bb3:")&&k!="bb3:prefs"&&k!="bb3:last").forEach(k=>lsDel(k));toast("Черновики очищены");break}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id=="fb"){setVal("fallback",t.value.slice(0,300)||S.bot.fallback);$("#fbc").textContent=t.value.length+"/300"}
 else if(t.id=="post"){S.post=t.value;postUi();saveDraftSoon();ui()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="sw-active"){setVal("active",t.checked);renderBot()}else if(t.id=="sw-support"){setVal("support",t.checked);renderBot()}
 else if(t.dataset?.pref){PREF[t.dataset.pref]=t.checked;lsSet("bb3:prefs",PREF);applyPrefs()}});
$$(".tb").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#botbtn").onclick=()=>{hap();openBots()};
$("#fab").onclick=()=>{hap();openReview()};
$("#undo").onclick=undo;$("#redo").onclick=redo;$("#fit").onclick=fit;
$("#lay").onclick=()=>{if(!S.flow)return;mutate(()=>layout(S.flow.nodes,S.flow.start));fit();hap()};
$("#heat").onclick=()=>{S.heat=!S.heat;if(S.heat&&!Object.keys(S.heatMap).length)toast("Пока нет данных о просмотрах");renderFlow()};
$("#tpl").onclick=()=>S.flow&&openTemplates();
$("#pvb").onclick=()=>S.flow&&openPreview(S.flow.start);
$$(".zoom button").forEach(b=>b.onclick=()=>zoomTo(S.view.k*(b.dataset.z=="1"?1.2:1/1.2)));
$("#fs").onclick=()=>{try{if(tg){tg.isFullscreen?tg.exitFullscreen():tg.requestFullscreen()}else document.documentElement.requestFullscreen?.()}catch{}};
let rz;addEventListener("resize",()=>{applyView();clearTimeout(rz);rz=setTimeout(()=>{if(S.tab=="stats")drawCharts()},150)});
setInterval(()=>{const c=$("#cd");if(c&&S.sess.exp)c.textContent=fmtLeft(new Date(S.sess.exp)-Date.now());ui()},1000);
setInterval(refresh,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes?.();tg.setHeaderColor?.("#070708");tg.setBackgroundColor?.("#070708");try{if(tg.isVersionAtLeast?.("8.0")&&!tg.isFullscreen)tg.requestFullscreen()}catch{}}
applyPrefs();boot();
</script></body></html>
