<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>Bot Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--y:#e6ff3d;--l:#a9a8f8;--o:#ff6a2b;--g:#5dffb0;--b:#6fd3ff;--r:#ff5d6c;--bg:#070708;--c1:#101013;--c2:#17171c;--ln:#ffffff1f;--tx:#f4f4f6;--mu:#8d8d99;
--st:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
--sb:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(900px 520px at 90% -12%,#a9a8f826,transparent 60%),radial-gradient(700px 420px at -10% 108%,#e6ff3d16,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.m,.mu{font-family:"Space Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.mu{color:var(--mu)}
.note{color:var(--mu);font-size:13px;line-height:1.6;white-space:pre-line}
#app{position:relative;display:flex;flex-direction:column;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) 12px 8px}
.logo{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--y),var(--l));color:#000;display:grid;place-items:center;font-weight:700;font-style:normal;box-shadow:0 4px 18px #e6ff3d33}
.botbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--c1);border:1px solid var(--ln);border-radius:99px;padding:5px 12px 5px 5px;text-align:left;transition:border-color .15s}
.botbtn:active{border-color:var(--y)}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--l),var(--y));color:#000;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;overflow:hidden}
.av{position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--g);box-shadow:0 0 9px var(--g)}
.car{color:var(--mu);font-size:11px}
.pillerr{background:none;flex:none;color:var(--o);border:1px solid var(--o);border-radius:99px;padding:6px 10px;white-space:nowrap;font-family:"Space Mono",monospace;font-size:10.5px}
.ic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--c1)}
.banner{margin:0 12px 6px;padding:9px 12px;border-radius:12px;background:#ff6a2b22;border:1px solid var(--o);color:#ffc8ae;font-size:12.5px}
.banner.info{background:#a9a8f822;border-color:var(--l);color:#dcdcff}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:block;animation:vin .22s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:4px 14px 130px;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto;display:grid;gap:12px}.wrap>*{min-width:0}
#bar{display:flex;gap:2px;padding:6px 10px calc(var(--sb) + 6px);border-top:1px solid var(--ln);background:#0a0a0cee;backdrop-filter:blur(14px);z-index:6}
.tb{flex:1;display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--mu);padding:6px 0;border-radius:14px;position:relative}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--y)}.tb.on::after{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--y);box-shadow:0 0 12px var(--y)}
.tb span{font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
#fab{position:fixed;right:14px;bottom:calc(var(--sb) + 78px);z-index:7;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--y);color:#000;padding:13px 18px;font-weight:700;box-shadow:0 8px 30px #e6ff3d44,0 2px 0 #fff6 inset;animation:pop .3s ease}
#fab[hidden]{display:none}
#fab b{background:#000;color:var(--y);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
#fab.mini{bottom:calc(var(--sb) + 160px)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* cards */
.cd{background:linear-gradient(180deg,#14141a,#101013);border:1px solid var(--ln);border-radius:20px;padding:14px}
.cd h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd h3 small{font-weight:400}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:flex;gap:4px;background:#0a0a0c;border:1px solid var(--ln);border-radius:99px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:7px 10px;color:var(--mu);font-family:"Space Mono",monospace;font-size:11px;white-space:nowrap}
.seg button.on{background:var(--y);color:#000;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chp{border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--mu)}
.chp.on{border-color:var(--l);color:#000;background:var(--l);font-weight:600}
.main{border:0;border-radius:99px;background:var(--y);color:#000;padding:12px 18px;font-weight:700;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
.ghost{border:1px solid var(--ln);background:none;border-radius:99px;padding:11px 16px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.ghost.danger{border-color:var(--r);color:var(--r)}
.ghost:disabled,.ic:disabled,.seg button:disabled,.main:disabled{opacity:.35}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2>*{flex:1}
/* kpi */
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,#17171d,#0f0f12);border:1px solid var(--ln);border-radius:18px;padding:12px 12px 10px;min-height:118px}
.kv{font-size:27px;font-weight:700;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.kd{margin-top:4px;min-height:18px}
.dl{display:inline-block;border-radius:99px;padding:2px 8px;font-size:11px;font-family:"Space Mono",monospace;background:#ffffff12;color:var(--mu)}
.dl.up{background:#5dffb022;color:var(--g)}.dl.dn{background:#ff5d6c22;color:var(--r)}
.ksp{position:absolute;right:6px;bottom:6px;opacity:.9}
.ks{margin-top:4px}
/* charts */
.ch{position:relative;width:100%}
.ch svg{max-width:100%;display:block;touch-action:pan-y;overflow:visible}
.gl{stroke:#ffffff14;stroke-width:1}.ax{fill:var(--mu);font:10px "Space Mono",monospace}
.cl{stroke:#ffffff55;stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;pointer-events:none;background:#000d;border:1px solid var(--ln);border-radius:12px;padding:7px 10px;font-size:11.5px;z-index:3;white-space:nowrap;backdrop-filter:blur(8px)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .05s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s var(--d,0ms) cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.noanim .draw{animation:none;stroke-dashoffset:0}.noanim .bar,.noanim #fab,.noanim .view.on{animation:none}
.legend2{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--mu);font-size:12px}.legend2 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.donut{width:120px;height:120px;flex:none}.donut .dv{font:700 19px "Space Grotesk";fill:#fff}.donut .ds{font:9px "Space Mono";fill:var(--mu);text-transform:uppercase}
.hb{display:grid;gap:9px}.hbr{display:grid;gap:4px}
.hbt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.hbt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbl{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.hbl i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--l),var(--y));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.plist{display:grid;gap:8px}.pit{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b0b0e;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.empty{color:#777;font-size:12.5px;padding:8px 4px}
.hero{text-align:center;padding:30px 16px;display:grid;gap:10px;justify-items:center}.hero .big{font-size:42px}
.hero h3{justify-content:center;margin:0}
/* switches */
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:#2a2a32;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--y)}.sw input:checked+i::after{transform:translateX(18px);background:#000}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10}.line:last-child{border-bottom:0}
.line small{display:block;color:var(--mu);font-size:12px}
/* inputs */
label{display:flex;justify-content:space-between;color:var(--mu);margin:10px 0 5px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
input[type=text],input[type=url],input:not([type]),select,textarea{width:100%;background:#0a0a0c;border:1px solid var(--ln);border-radius:14px;padding:11px 12px;outline:0;font-size:16px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8d8d99 50%),linear-gradient(135deg,#8d8d99 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--y)}textarea{min-height:110px;resize:vertical}
/* profile */
.profile-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.profile-metrics>div{display:grid;gap:5px;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;background:#09090c}
.profile-metrics>div>b{display:flex;align-items:center;gap:6px;font-size:19px}.profile-metrics small{font-size:12px;color:var(--mu);font-weight:400}
.star-mark{display:inline-block;width:17px;height:17px;vertical-align:-3px;fill:#ffd84d;filter:drop-shadow(0 1px 4px #ffd84d55)}.star-mark.tiny{width:12px;height:12px;vertical-align:-2px}
.premium-mini,.referral-mini{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;cursor:pointer}
.premium-mini{border-color:#e6ff3d55;background:linear-gradient(110deg,#25220d,#121216 65%)}
.premium-gem,.ref-gem{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:#e6ff3d18;color:var(--y)}
.premium-gem svg,.ref-gem svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.premium-copy,.ref-copy{flex:1;min-width:0;display:grid;gap:2px}.premium-copy b,.ref-copy b{font-size:14px}.premium-copy small,.ref-copy small{font-size:11.5px;color:var(--mu);font-weight:400}
.premium-arrow{font-size:22px;color:var(--mu)}.referral-mini .ref-gem{background:#a9a8f81a;color:var(--l)}
.plan-current{border-color:#e6ff3d66;background:linear-gradient(135deg,#25220d,#141419)}
.plan-card{display:grid;gap:10px}.plan-list{display:grid;gap:6px}.plan-list div{display:flex;gap:8px;color:#c7c7cf;font-size:12.5px}.plan-list i{font-style:normal;color:var(--g)}
.plan-price{display:inline-flex;align-items:center;gap:5px;color:#000;background:var(--y);border-radius:99px;padding:5px 10px;font-weight:700;font-family:"Space Mono",monospace;font-size:11px}
.plan-price .star-mark{width:13px;height:13px;filter:none}
.plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.plan-sub{color:var(--mu);font-size:11px}
.prof{display:flex;gap:14px;align-items:center}.prof .av{width:64px;height:64px;font-size:26px;border:2px solid var(--y)}
.badge{display:inline-block;border-radius:99px;padding:3px 9px;font:10px "Space Mono",monospace;text-transform:uppercase;background:#ffffff14;margin:2px 4px 0 0}.badge.y{background:var(--y);color:#000}.badge.l{background:var(--l);color:#000}
.meter{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--l),var(--y));border-radius:99px}
.step{display:flex;gap:12px;padding:8px 0}.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;font-size:12px}
.bot-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #ffffff10;cursor:pointer;border-radius:12px}.bot-row:last-child{border-bottom:0}
.bot-row.cur{background:#e6ff3d12}
.bot-row .bn small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.chk{flex:none;color:var(--y);font-weight:700}
/* canvas */
#cv{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#ffffff26 1px,transparent 1.5px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.w{fill:none;stroke:var(--l);stroke-width:2}.w.tmp{stroke:var(--y);stroke-dasharray:6 5}.w.bad{stroke:var(--o);stroke-dasharray:4 4}
.node{position:absolute;width:230px;border-radius:16px;background:#101012;border:1px solid var(--l);-webkit-user-select:none;user-select:none;transition:box-shadow .2s}
.node.start{border-color:var(--y)}.node.sel{box-shadow:0 0 0 2px var(--y),0 12px 40px #000a}
.hd{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:15px 15px 0 0;background:var(--l);color:#000;font-weight:600;cursor:grab;position:relative}
.start .hd{background:var(--y)}.hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv{font:700 10px "Space Mono",monospace;font-style:normal;background:#000;color:var(--o);border-radius:99px;padding:2px 7px}
.ph{font-style:normal;font-size:13px;opacity:.4;cursor:pointer}.ph.has{opacity:1}
.node .in{position:absolute;left:-8px;top:10px;width:14px;height:14px;border-radius:50%;background:#000;border:2px solid var(--l)}.start .in{display:none}
.tx{height:46px;overflow:hidden;padding:8px 12px;color:#bdbdc6;font-size:12.5px;cursor:pointer;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rows{min-height:32px;padding-bottom:10px}
.row{height:32px;padding:3px 10px;position:relative;cursor:pointer}
.row span{display:flex;align-items:center;justify-content:space-between;height:26px;border:1px solid #fff6;border-radius:13px;padding:0 12px;font-size:12.5px;overflow:hidden;white-space:nowrap}
.row.url span{border-color:var(--y);color:var(--y)}.row.bad span{border-color:var(--o);color:var(--o)}
.out{position:absolute;right:-8px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--l);border:2px solid #000;cursor:crosshair;touch-action:none}.row.url .out{display:none}
.out::before{content:"";position:absolute;inset:-14px}.ph{padding:6px;margin:-6px}
.nempty{color:#666;font-size:12px;padding:7px 14px}
#dock{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;z-index:4;background:#0c0c0fe6;border:1px solid var(--ln);border-radius:20px;padding:8px;backdrop-filter:blur(10px)}
.chip{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;border:1px solid var(--ln);border-radius:12px;padding:7px 8px;width:62px;text-align:center;line-height:1.15;font-family:"Space Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.chip b{display:block;font-size:18px;font-weight:400}
.chip[data-t=screen]{background:var(--l);color:#000;border-color:var(--l)}.chip[data-t=btn]{border-color:#fff}.chip[data-t=url]{border-color:var(--y);color:var(--y)}
.gc{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);opacity:.92}
#v-flow.off #dock{opacity:.3;pointer-events:none}
.eflow{position:absolute;inset:0;display:grid;place-items:center;z-index:3;padding:20px;pointer-events:none}
.eflow .cd{pointer-events:auto;max-width:360px;width:100%;background:#101013f2;backdrop-filter:blur(10px)}
/* sheets */
#layer{position:absolute;inset:0;pointer-events:none;z-index:50}
.sheet{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;background:var(--bg);opacity:0;transform:translateY(18px);transition:opacity .2s,transform .24s cubic-bezier(.2,.9,.3,1)}
.sheet.shown{opacity:1;transform:none}
.sh{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sb) + 28px);background:radial-gradient(700px 400px at 100% -10%,#a9a8f81a,transparent 60%),var(--bg)}
.sh>.acts2:last-child{position:sticky;bottom:0;z-index:3;margin:14px -16px 0!important;padding:14px 16px calc(var(--sb) + 12px);background:linear-gradient(transparent,#070708 30%)}
.grab{display:none}
.shh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;margin:0 -16px 8px;padding:calc(var(--st) + 10px) 16px 10px;background:#070708f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}.shh h3{margin:0;font-size:18px;font-weight:600;flex:1}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--c1);font-size:20px;line-height:1}
.fmt{display:flex;gap:6px;margin-bottom:6px}.fmt button{width:38px;height:32px;border-radius:10px;border:1px solid var(--ln);background:#0a0a0c;font-weight:700}
.bl{display:grid;gap:6px}.br{display:flex;align-items:center;gap:6px;background:#0a0a0c;border:1px solid var(--ln);border-radius:14px;padding:6px 8px}.br.bad{border-color:var(--o)}
.br .bm{flex:1;min-width:0}
.br .bli{padding:7px 10px;border-radius:10px;font-size:15px;background:#111114}
.br small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;padding-left:2px}
.br .bi{width:26px;height:26px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;flex:none}
.br button{flex:none;width:30px;height:30px;border-radius:10px;border:1px solid var(--ln);background:none}.br button:disabled{opacity:.25}
details.cd>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}details.cd>summary::-webkit-details-marker{display:none}details.cd>summary::after{content:"▾";color:var(--mu)}details.cd[open]>summary::after{content:"▴"}details.cd[open]>summary{margin-bottom:10px}details.cd .cd{background:none;border:0;border-top:1px solid var(--ln);border-radius:0;padding:12px 0 0;margin-top:12px}
.tplc{margin-bottom:10px}
.codebox{font:11px "Space Mono",monospace;min-height:80px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--y);color:#000;border-radius:99px;padding:10px 16px;z-index:99;max-width:90vw;text-align:center;font-weight:600;animation:pop .2s}.toast.err{background:var(--o)}
/* preview */
.pv{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;background:#0e1621;overflow:hidden}

.pvh{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 14px 10px;background:#17212b;border-bottom:1px solid #0006}
